name: mistech
description: "MiSTech - Aplikasi Edukasi Bencana Alam"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0

  # Navigation
  go_router: ^14.2.7

  # State Management
  provider: ^6.1.2

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # Video Player
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Storage & Cache
  shared_preferences: ^2.3.1
  flutter_cache_manager: ^3.3.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  webview_flutter: ^4.13.1
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # - assets/images/
    - assets/icons/
    # - assets/animations/
    - assets/html/
    - assets/ml/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800